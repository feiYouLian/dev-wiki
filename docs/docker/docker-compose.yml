version: "3"

services:
  web:
    build: ./web
    ports:
      - "8080:8080"
    depends_on:
      - server

  server:
    build: ./server
    ports:
      - "8888:8888"
    volumes:
      - ./server/tmp_data:/tmp
    depends_on:
      - mysql

  mysql:
    image: mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: oauth # Create a library called blog
      MYSQL_ROOT_PASSWORD: 123456 # Set the password of the root user
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/mysql_data:/var/lib/mysql
    restart: always

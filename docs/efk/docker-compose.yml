version: "3"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.16.2
    container_name: elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
    # chmod 777 /opt/efk/es/data 赋权限，不然起不来
      - /opt/efk/es/data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    networks:
      - elastic
  # filebeat:
  #   image: docker.elastic.co/beats/filebeat:7.16.2
  #   container_name: filebeat
  #   volumes:
  #   # https://github.com/elastic/beats/blob/v7.16.2/filebeat/filebeat.docker.yml
  #   # curl -L -O https://raw.githubusercontent.com/elastic/beats/3c518f4d17a15dc85bdd68a5a03d5af51d9edd8e/filebeat/filebeat.docker.yml
  #     - /opt/efk/filebeat/filebeat.docker.yml:/usr/share/filebeat/filebeat.yml
  #     - /opt/efk/filebeat/data:/usr/share/filebeat/data
  #   depends_on:
  #     - elasticsearch
  #   networks:
  #     - elastic
  kibana:
    image: docker.elastic.co/kibana/kibana:7.16.2
    container_name: kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elastic
networks:
  elastic:
    driver: bridge
